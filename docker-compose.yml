version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: digital_twin_postgres
    environment:
      POSTGRES_DB: digital_twin
      POSTGRES_USER: robot_admin
      POSTGRES_PASSWORD: robot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot_admin -d digital_twin"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: digital_twin_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  postgres_data:
